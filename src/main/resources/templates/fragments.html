<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>

<nav th:fragment="navbar" class="navbar navbar-dark px-4" style="background-color: #2f6f6d">
    <span class="navbar-text text-white" style="font-size: 1.25rem">
        <strong th:text="${currentUser.email}">admin@mail.ru</strong>
        with roles:
        <span th:each="r : ${currentUser.roles}"
              th:text="${#strings.replace(r.name, 'ROLE_', '')} + ' '">ADMIN</span>
    </span>
    <form th:action="@{/logout}" method="post" class="form-inline">
        <button type="submit" class="btn btn-link text-white-50 p-0">Logout</button>
    </form>
</nav>

<div th:fragment="sidebar(active)" class="nav flex-column nav-pills pt-3">
    <a th:if="${currentUser.authorities.![authority].contains('ROLE_ADMIN')}"
       class="nav-link" th:classappend="${active == 'admin'} ? 'active'"
       th:href="@{/admin}">Admin</a>
    <a class="nav-link" th:classappend="${active == 'user'} ? 'active'"
       th:href="@{/user}">User</a>
</div>


</body>
</html>
