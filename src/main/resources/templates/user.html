<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>User information-page</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <style>
        body { background: #f8f9fa; }
        .sidebar { background: #fff; min-height: calc(100vh - 56px); }
        .nav-pills .nav-link.active { background-color: #2f6f6d; }
        .nav-pills .nav-link:not(.active) { color: #2f6f6d; }
    </style>
</head>
<body>

<div th:replace="~{fragments :: navbar}"></div>

<div class="container-fluid">
    <div class="row">

        <div class="col-md-2 sidebar px-0">
            <div th:replace="~{fragments :: sidebar('user')}"></div>
        </div>

        <main class="col-md-10 pt-3 px-4 pb-5">

            <h1>User information-page</h1>

            <div id="alerts"></div>

            <div class="card mt-3">
                <div class="card-header"><h5 class="mb-0">About user</h5></div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-striped mb-0">
                            <thead>
                            <tr>
                                <th>ID</th>
                                <th>First Name</th>
                                <th>Last Name</th>
                                <th>Age</th>
                                <th>Email</th>
                                <th>Position</th>
                                <th>Salary</th>
                                <th>Employment</th>
                                <th>Role</th>
                            </tr>
                            </thead>
                            <tbody id="user-body">
                            <tr><td colspan="9" class="text-center text-muted">Loading…</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<script th:src="@{/js/app.js}"></script>
<script th:inline="none">
    (function () {
        const body = document.getElementById('user-body');
        const dash = '—';

        api('/api/user')
            .then(u => {
                const salary = u.salary == null ? dash
                    : Number(u.salary).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
                body.innerHTML = `
                    <tr>
                        <td>${esc(u.id)}</td>
                        <td>${esc(u.name)}</td>
                        <td>${esc(u.surname)}</td>
                        <td>${esc(u.age)}</td>
                        <td>${esc(u.email)}</td>
                        <td>${esc(u.position || dash)}</td>
                        <td>${esc(salary)}</td>
                        <td>${esc(u.employmentType || dash)}</td>
                        <td>${roleNames(u.roles)}</td>
                    </tr>`;
            })
            .catch(err => {
                body.innerHTML = '';
                document.getElementById('alerts').innerHTML =
                    '<div class="alert alert-danger mt-3">' + esc(err.message || 'Failed to load user') + '</div>';
            });
    })();
</script>
</body>
</html>
